[tool.poetry]
name = "hh-vacancies"
version = "0.1.0"
description = "Поиск вакансий с hh.ru и загрузка в PostgreSQL"
authors = ["Ваше Имя <you@example.com>"]
readme = "README.md"
packages = [{ include = "hh_vacancies", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.32.3"
psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.1"
tabulate = "^0.9.0"
pydantic = "^2.7.0"
typing-extensions = "^4.12.2"

[tool.poetry.group.dev.dependencies]
black = "^24.4.2"
isort = "^5.13.2"
flake8 = "^7.1.0"
mypy = "^1.10.0"
pytest = "^8.2.0"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]  # чтобы не конфликтовать с black